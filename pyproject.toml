[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcrp-mcp"
version = "0.1.0"
description = "MCP server for the Banco Central de Reserva del Peru (BCRP) statistics API — access macroeconomic data, exchange rates, interest rates, monetary indicators, and more"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "JOSETRA44", email = "drivearchiver@gmail.com" },
]
keywords = [
    "mcp", "bcrp", "peru", "banco-central", "macroeconomics",
    "economic-data", "exchange-rate", "inflation", "gdp",
    "model-context-protocol", "llm", "ai", "statistics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/JOSETRA44/bcrp-mcp"
Repository = "https://github.com/JOSETRA44/bcrp-mcp"
"Bug Tracker" = "https://github.com/JOSETRA44/bcrp-mcp/issues"
Documentation = "https://estadisticas.bcrp.gob.pe/estadisticas/series/ayuda/api"

[project.scripts]
bcrp-mcp = "bcrp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bcrp_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
